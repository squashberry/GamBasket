<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Messages - GamBasket</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="css/style.css">
    <script>if (localStorage.getItem("gambasket-theme") === "dark") document.documentElement.classList.add("dark");</script>
</head>
<body class="messages-page">
    <svg class="messages-icon-sprite" aria-hidden="true"><defs>
        <symbol id="icon-arrow-left" viewBox="0 0 24 24"><path d="M19 12H5m6 6-6-6 6-6" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></symbol>
        <symbol id="icon-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="m16 16 5 5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
        <symbol id="icon-chat" viewBox="0 0 24 24"><path d="M21 11.5a8.5 8.5 0 0 1-12.3 7.6L3 21l1.9-5.7a8.5 8.5 0 0 1 7.6-12.3h.5a8.5 8.5 0 0 1 8 8v.5Z" fill="none" stroke="currentColor" stroke-width="1.8"/></symbol>
        <symbol id="icon-store" viewBox="0 0 24 24"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V9Z" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M9 22V12h6v10" fill="none" stroke="currentColor" stroke-width="1.8"/></symbol>
        <symbol id="icon-cart" viewBox="0 0 24 24"><circle cx="9" cy="20" r="1.5" fill="currentColor"/><circle cx="18" cy="20" r="1.5" fill="currentColor"/><path d="M2.5 3.5h3l2.4 11.3a2 2 0 0 0 2 1.6h8.2a2 2 0 0 0 2-1.6l1.4-7.3H7" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
        <symbol id="icon-home" viewBox="0 0 24 24"><path d="M3.5 10.7 12 3.8l8.5 6.9v8.1a1.7 1.7 0 0 1-1.7 1.7H5.2a1.7 1.7 0 0 1-1.7-1.7v-8.1ZM9 20.5v-5.8h6v5.8" fill="none" stroke="currentColor" stroke-width="1.8"/></symbol>
        <symbol id="icon-box" viewBox="0 0 24 24"><path d="m4 7.5 8-4.5 8 4.5v9L12 21l-8-4.5v-9Z" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="m4.4 7.7 7.6 4.3 7.6-4.3M12 12v9" fill="none" stroke="currentColor" stroke-width="1.8"/></symbol>
        <symbol id="icon-heart" viewBox="0 0 24 24"><path d="M20.8 8.7c0 5.2-8.8 10.1-8.8 10.1S3.2 13.9 3.2 8.7A4.7 4.7 0 0 1 12 6.1a4.7 4.7 0 0 1 8.8 2.6Z" fill="none" stroke="currentColor" stroke-width="1.8"/></symbol>
        <symbol id="icon-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M5 20c.6-3.6 3.1-5.5 7-5.5s6.4 1.9 7 5.5" fill="none" stroke="currentColor" stroke-width="1.8"/></symbol>
        <symbol id="icon-moon" viewBox="0 0 24 24"><path d="M20 15.2A8.3 8.3 0 0 1 8.8 4a8.3 8.3 0 1 0 11.2 11.2Z" fill="none" stroke="currentColor" stroke-width="1.8"/></symbol>
        <symbol id="icon-truck" viewBox="0 0 24 24"><rect x="1" y="3" width="15" height="13" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M16 8h4l3 3v5h-7V8Z" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="5.5" cy="18.5" r="2.5" fill="currentColor"/><circle cx="18.5" cy="18.5" r="2.5" fill="currentColor"/></symbol>
    </defs></svg>

    <header class="desktop-app-header"><a href="index.html" class="desktop-app-brand"><span>GamB</span><svg class="brand-bag-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4zM3 6h18M16 10a4 4 0 0 1-8 0"/></svg><span>sket</span></a><div class="desktop-app-search"><a href="explore.html" class="desktop-search-fake-input"><svg class="ui-icon"><use href="#icon-search"></use></svg>Search products...</a></div><nav class="desktop-app-nav"><a href="index.html" class="desktop-app-nav-link">Home</a><a href="explore.html" class="desktop-app-nav-link">Explore</a><a href="orders.html" class="desktop-app-nav-link">Orders</a><a href="wishlist.html" class="desktop-app-nav-link">Wishlist</a><a href="messages.html" class="desktop-app-nav-link active">Messages</a><a href="me.html" class="desktop-app-nav-link">Me</a></nav><div class="desktop-app-actions"><button class="icon-button" id="desktopThemeToggle" type="button" aria-label="Toggle dark mode"><svg class="ui-icon"><use href="#icon-moon"></use></svg></button><a href="cart.html" class="icon-button" aria-label="Cart"><svg class="ui-icon"><use href="#icon-cart"></use></svg></a></div></header>
    <header class="mobile-header"><div class="header-top"><div class="messages-mobile-title"><button id="mobileChatBackBtn" class="icon-button" type="button" aria-label="Back to conversations" hidden><svg class="ui-icon"><use href="#icon-arrow-left"></use></svg></button><a href="index.html" class="brand">Messages</a></div><button class="icon-button" id="themeToggle" type="button" aria-label="Toggle dark mode"><svg class="ui-icon"><use href="#icon-moon"></use></svg></button></div></header>

    <main class="messages-shell" id="messagesShell"><aside class="conversation-panel" id="conversationsPane"><div class="conversation-header"><div class="conversation-title-row"><h1 class="conversation-title">Messages</h1><span id="unreadTotalBadge" class="unread-total">0</span></div><label class="message-search"><svg class="ui-icon"><use href="#icon-search"></use></svg><input id="conversationSearch" type="search" placeholder="Search conversations..." autocomplete="off"></label></div><div id="conversationList" class="conversation-list"></div></aside><section class="chat-panel" id="activeChatPane"><div id="chatEmpty" class="chat-empty"><div class="chat-empty-inner"><div class="chat-empty-logo"><svg class="ui-icon"><use href="#icon-chat"></use></svg></div><h2>Your GamBasket conversations</h2><p>Select a conversation to chat with a buyer or seller.</p></div></div><div id="chatActive" class="chat-active" hidden><header class="chat-header"><button id="mobileChatBack" class="mobile-chat-back" type="button" aria-label="Back"><svg class="ui-icon"><use href="#icon-arrow-left"></use></svg></button><div class="person-avatar" id="chatAvatar">U</div><div class="chat-header-info"><strong id="chatName" class="chat-header-name">GamBasket Member</strong><span id="chatStatus" class="chat-header-status">GamBasket member</span></div></header><div id="chatProductContext" class="chat-product-context" hidden></div><div id="realtimeError" class="realtime-error">Realtime connection interrupted. <button id="reconnectBtn" type="button">Reconnect</button></div><div id="messagesArea" class="messages-area"></div><button id="newMessagesPill" class="new-messages-pill" type="button">New messages</button><form id="messageComposer" class="composer"><textarea id="messageInput" rows="1" maxlength="4000" placeholder="Type a message..." autocomplete="off"></textarea><button id="sendMessageBtn" class="send-btn" type="submit" aria-label="Send message"><svg class="ui-icon"><path d="m4 4 16 8-16 8 3-8-3-8Zm3 8h13" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button></form></div></section></main>
    <nav class="bottom-navigation"><button class="nav-item" data-page="home" type="button"><span class="nav-icon"><svg class="ui-icon"><use href="#icon-home"></use></svg></span><span class="nav-label">Home</span></button><button class="nav-item" data-page="explore" type="button"><span class="nav-icon"><svg class="ui-icon"><use href="#icon-search"></use></svg></span><span class="nav-label">Explore</span></button><button class="nav-item" data-page="orders" type="button"><span class="nav-icon"><svg class="ui-icon"><use href="#icon-box"></use></svg></span><span class="nav-label">Orders</span></button><button class="nav-item" data-page="wishlist" type="button"><span class="nav-icon"><svg class="ui-icon"><use href="#icon-heart"></use></svg></span><span class="nav-label">Wishlist</span></button><button class="nav-item" data-page="me" type="button"><span class="nav-icon"><svg class="ui-icon"><use href="#icon-user"></use></svg></span><span class="nav-label">Me</span></button></nav>
    <script src="js/config.js"></script><script src="js/supabase.js"></script><script src="js/auth-errors.js"></script><script src="js/auth-guard.js"></script><script src="js/notifications.js"></script><script src="js/messages.js"></script>
    <script src="js/states.js"></script>
</body>
</html>
