<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
    <title>Explore the marketplace — JulaDirect</title>
    <meta name="description" content="Search and filter products from sellers across The Gambia. Compare listings, save searches and shop with cash on delivery.">
    <meta name="theme-color" content="#1451e6">
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="css/jd.css">
</head>
<body class="jd">
    <div id="jd-header"></div>

    <main id="jd-main" class="jd-container">
        <nav class="jd-breadcrumb" aria-label="Breadcrumb"><a href="index.html">Home</a><span aria-hidden="true">/</span><span aria-current="page">Explore</span></nav>
        <div class="jd-page-head">
            <h1 id="jd-title" style="font-size:clamp(1.6rem,3vw,2.3rem)">Explore the marketplace</h1>
            <p id="jd-subtitle">Search, filter and compare products from sellers across The Gambia.</p>
        </div>

        <div class="jd-explore">
            <aside class="jd-filters" id="jd-filters" aria-label="Filters">
                <div class="jd-filters__head">
                    <h2 style="font-size:1.15rem">Filters</h2>
                    <button class="jd-btn jd-btn--ghost jd-btn--sm" type="button" id="jd-filters-close" aria-label="Close filters">&times;</button>
                </div>
                <form class="jd-filters__body" id="jd-filter-form" autocomplete="off" onsubmit="return false">
                    <div class="jd-fgroup"><h3>Category</h3><div id="jd-f-cats"><div class="jd-skel" style="height:120px" aria-hidden="true"></div></div></div>
                    <div class="jd-fgroup" id="jd-price-group">
                        <div class="jd-fgroup__head"><h3>Price range</h3><button type="button" class="jd-reset" id="jd-price-reset">Reset</button></div>
                        <p class="jd-fgroup__sub" id="jd-price-avg" hidden></p>
                        <div class="jd-hist" id="jd-hist" aria-hidden="true" hidden></div>
                        <div class="jd-range" id="jd-range" hidden><span class="jd-range__track"></span><span class="jd-range__fill" id="jd-range-fill"></span><input type="range" id="jd-rmin" aria-label="Minimum price" min="0" max="100" value="0"><input type="range" id="jd-rmax" aria-label="Maximum price" min="0" max="100" value="100"></div>
                        <div class="jd-pricebox">
                            <div class="jd-field"><label class="jd-sr" for="jd-min">Minimum price</label><input class="jd-input" id="jd-min" type="number" min="0" inputmode="numeric" placeholder="Min"></div>
                            <div class="jd-field"><label class="jd-sr" for="jd-max">Maximum price</label><input class="jd-input" id="jd-max" type="number" min="0" inputmode="numeric" placeholder="Max"></div>
                        </div>
                    </div>
                    <div class="jd-fgroup">
                        <h3>Condition</h3>
                        <label class="jd-radio"><span><input type="radio" name="condition" value="" checked>Any condition</span></label>
                        <label class="jd-radio"><span><input type="radio" name="condition" value="New">New</span></label>
                        <label class="jd-radio"><span><input type="radio" name="condition" value="Like New">Like new</span></label>
                        <label class="jd-radio"><span><input type="radio" name="condition" value="Refurbished">Refurbished</span></label>
                        <label class="jd-radio"><span><input type="radio" name="condition" value="Used - Good">Used &ndash; good</span></label>
                        <label class="jd-radio"><span><input type="radio" name="condition" value="Used - Fair">Used &ndash; fair</span></label>
                    </div>
                    <div class="jd-fgroup">
                        <h3>Location</h3>
                        <label class="jd-sr" for="jd-location">Location</label>
                        <select class="jd-select" id="jd-location">
                            <option value="all">All Gambia</option><option>Banjul</option><option>Serrekunda</option><option>Kanifing</option><option>Bakau</option><option>Fajara</option><option>Kotu</option><option>Kololi</option><option>Brufut</option><option>Brikama</option>
                        </select>
                    </div>
                    <div class="jd-fgroup">
                        <h3>Brand or model</h3>
                        <label class="jd-sr" for="jd-brand">Brand or model</label>
                        <input class="jd-input" id="jd-brand" type="search" maxlength="80" placeholder="e.g. Samsung, iPhone, Toyota">
                    </div>
                    <div class="jd-fgroup">
                        <h3>Availability</h3>
                        <label class="jd-switch"><span>In stock only</span><input type="checkbox" id="jd-stock"><span class="jd-switch__track" aria-hidden="true"></span></label>
                        <div class="jd-field" style="margin-top:6px"><span class="jd-label" id="jd-seg-label">Delivery options</span><div class="jd-seg" role="group" aria-labelledby="jd-seg-label"><button type="button" data-seg="0" aria-pressed="true">Any</button><button type="button" data-seg="1" aria-pressed="false">Delivery</button></div></div><input type="checkbox" id="jd-delivery" class="jd-sr" tabindex="-1" aria-hidden="true">
                    </div>
                </form>
                <div class="jd-filters__foot">
                    <button type="button" class="jd-btn jd-btn--secondary" id="jd-filters-clear">Clear all</button>
                    <button type="button" class="jd-btn jd-btn--primary" id="jd-filters-apply">Show results</button>
                </div>
            </aside>

            <section aria-label="Search results">
                <div class="jd-toolbar">
                    <div class="jd-toolbar__count" id="jd-count" aria-live="polite">Loading&hellip;</div>
                    <div class="jd-toolbar__right">
                        <button class="jd-btn jd-btn--secondary jd-btn--sm jd-filter-open" type="button" id="jd-filters-open"><span id="jd-ico-filter"></span>Filters</button>
                        <button class="jd-btn jd-btn--secondary jd-btn--sm" type="button" id="jd-save-search"><span id="jd-ico-save"></span>Save search</button>
                        <label class="jd-sr" for="jd-sort">Sort by</label>
                        <select class="jd-select" id="jd-sort">
                            <option value="newest">Newest first</option>
                            <option value="price_asc">Price: low to high</option>
                            <option value="price_desc">Price: high to low</option>
                            <option value="popular">Most popular</option>
                        </select>
                    </div>
                </div>
                <div class="jd-active" id="jd-active"></div>
                <div class="jd-grid" id="productGrid" aria-live="polite"></div>
                <nav class="jd-pagination" id="jd-pagination" aria-label="Pagination"></nav>
            </section>
        </div>
    </main>

    <dialog class="jd-dialog" id="jd-save-dialog" aria-labelledby="jd-save-title">
        <form id="jd-save-form">
            <div><h2 id="jd-save-title" style="font-size:1.3rem">Save this search</h2><p class="jd-muted" style="margin-top:6px">Keep your filters and find them again in Saved searches.</p></div>
            <div class="jd-field"><label class="jd-label" for="jd-save-name">Name</label><input class="jd-input" id="jd-save-name" maxlength="80" required></div>
            <label class="jd-switch"><span>Notify me when new matches are listed</span><input type="checkbox" id="jd-save-notify" checked><span class="jd-switch__track" aria-hidden="true"></span></label>
            <div class="jd-form-note" id="jd-save-status" role="status"></div>
            <div class="jd-dialog__actions">
                <button type="button" class="jd-btn jd-btn--secondary" id="jd-save-cancel">Cancel</button>
                <button type="submit" class="jd-btn jd-btn--primary" id="jd-save-confirm">Save search</button>
            </div>
        </form>
    </dialog>

    <div id="jd-footer"></div>
    <div id="jd-bottomnav"></div>

    <script src="js/config.js"></script>
    <script src="js/supabase.js"></script>
    <script src="js/jd-core.js"></script>
    <script src="js/jd-data.js"></script>
    <script src="js/jd-explore.js"></script>
</body>
</html>
