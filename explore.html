<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
    <title>Explore the marketplace — JulaDirect</title>
    <meta name="description" content="Search and filter products from verified sellers across The Gambia. Compare listings, save searches and shop with cash on delivery.">
    <meta name="theme-color" content="#1451e6">
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="css/jd.css">
    <link rel="stylesheet" href="css/jd-explore2.css">
</head>
<body class="jd">
    <div id="jd-header"></div>

    <main id="jd-main" class="jd-container ex">
        <header class="ex-head">
            <div class="ex-head__t">
                <h1 id="jd-title">Explore the marketplace</h1>
                <p id="jd-subtitle">Search, filter and compare products from sellers across The Gambia.</p>
            </div>
            <form class="ex-search" id="ex-search" role="search" autocomplete="off">
                <span class="ex-search__ico" id="ex-ico-search"></span>
                <label class="jd-sr" for="ex-q">Search products</label>
                <input id="ex-q" type="search" maxlength="100" placeholder="Search products, brands, sellers&hellip;" aria-controls="ex-suggest" aria-expanded="false">
                <button type="button" class="sx-cam" data-image-search aria-label="Search by image"></button>
                <button type="button" class="ex-search__clear" id="ex-q-clear" aria-label="Clear search" hidden></button>
                <button type="submit" class="jd-btn jd-btn--primary">Search</button>
                <div class="ex-suggest" id="ex-suggest" role="listbox" hidden></div>
            </form>
        </header>

        <div class="ex-rail" id="ex-cats" role="group" aria-label="Categories"></div>
        <div class="ex-quick" id="ex-quick" role="group" aria-label="Quick filters"></div>

        <div class="ex-layout">
            <aside class="ex-filters" id="ex-filters" aria-label="Filters" aria-hidden="false">
                <div class="ex-filters__head">
                    <span class="ex-grab" aria-hidden="true"></span>
                    <h2>Filters</h2>
                    <button type="button" class="ex-link" id="ex-clear-top">Clear all</button>
                    <button type="button" class="ex-x" id="ex-filters-close" aria-label="Close filters"></button>
                </div>
                <form class="ex-filters__body" id="ex-form" onsubmit="return false">
                    <details class="ex-fg" open>
                        <summary>Price</summary>
                        <div class="ex-fg__in">
                            <p class="ex-note" id="ex-avg" hidden></p>
                            <div class="ex-hist" id="ex-hist" aria-hidden="true" hidden></div>
                            <div class="ex-range" id="ex-range" hidden><span class="ex-range__fill" id="ex-fill"></span><input type="range" id="ex-rmin" aria-label="Minimum price"><input type="range" id="ex-rmax" aria-label="Maximum price"></div>
                            <div class="ex-price">
                                <label><span>Min (D)</span><input class="jd-input" id="ex-min" type="number" min="0" inputmode="numeric" placeholder="0"></label>
                                <i aria-hidden="true">&ndash;</i>
                                <label><span>Max (D)</span><input class="jd-input" id="ex-max" type="number" min="0" inputmode="numeric" placeholder="Any"></label>
                            </div>
                        </div>
                    </details>
                    <details class="ex-fg" open>
                        <summary>Condition</summary>
                        <div class="ex-fg__in ex-opts" id="ex-cond"></div>
                    </details>
                    <details class="ex-fg" open>
                        <summary>Location</summary>
                        <div class="ex-fg__in ex-opts" id="ex-loc"></div>
                    </details>
                    <details class="ex-fg" open>
                        <summary>Availability</summary>
                        <div class="ex-fg__in">
                            <label class="jd-switch"><span>In stock only</span><input type="checkbox" id="ex-stock"><span class="jd-switch__track" aria-hidden="true"></span></label>
                            <label class="jd-switch"><span>Delivery available</span><input type="checkbox" id="ex-delivery"><span class="jd-switch__track" aria-hidden="true"></span></label>
                        </div>
                    </details>
                    <details class="ex-fg">
                        <summary>Brand or model</summary>
                        <div class="ex-fg__in"><label class="jd-sr" for="ex-brand">Brand or model</label><input class="jd-input" id="ex-brand" type="search" maxlength="80" placeholder="e.g. Samsung, iPhone, Toyota"></div>
                    </details>
                </form>
                <div class="ex-filters__foot">
                    <button type="button" class="jd-btn jd-btn--secondary" id="ex-clear">Clear all</button>
                    <button type="button" class="jd-btn jd-btn--primary" id="ex-apply">Show results</button>
                </div>
            </aside>

            <section class="ex-results" aria-label="Search results">
                <div class="ex-bar">
                    <div class="ex-count" id="jd-count" aria-live="polite">Loading&hellip;</div>
                    <div class="ex-bar__r">
                        <button type="button" class="jd-btn jd-btn--secondary jd-btn--sm ex-open" id="ex-filters-open"><span id="ex-ico-filter"></span>Filters<b id="ex-fcount" hidden></b></button>
                        <button type="button" class="jd-btn jd-btn--secondary jd-btn--sm" id="jd-save-search"><span id="ex-ico-save"></span><span class="ex-hide-sm">Save search</span></button>
                        <div class="ex-view" role="group" aria-label="Layout">
                            <button type="button" data-view="grid" aria-pressed="true" aria-label="Grid view"></button>
                            <button type="button" data-view="list" aria-pressed="false" aria-label="List view"></button>
                        </div>
                        <label class="jd-sr" for="ex-sort">Sort by</label>
                        <select class="jd-select ex-sort" id="ex-sort">
                            <option value="newest">Newest</option>
                            <option value="popular">Most popular</option>
                            <option value="price_asc">Price: low to high</option>
                            <option value="price_desc">Price: high to low</option>
                        </select>
                    </div>
                </div>
                <div class="ex-countm" id="ex-countm" aria-hidden="true"></div>
                <div class="ex-active" id="jd-active"></div>
                <div id="ex-seller" hidden></div>
                <div class="jd-grid ex-grid" id="productGrid" aria-live="polite"></div>
                <nav class="jd-pagination" id="jd-pagination" aria-label="Pagination"></nav>
                <section class="ex-recent" id="ex-recent-sec" aria-labelledby="ex-recent-h" hidden>
                    <h2 id="ex-recent-h">Recently viewed</h2>
                    <div class="jd-grid" id="ex-recent"></div>
                </section>
            </section>
        </div>
    </main>

    <dialog class="jd-dialog" id="jd-save-dialog" aria-labelledby="jd-save-title">
        <form id="jd-save-form">
            <div><h2 id="jd-save-title" style="font-size:1.3rem">Save this search</h2><p class="jd-muted" style="margin-top:6px">Keep your filters and find them again in Saved searches.</p></div>
            <div class="jd-field"><label class="jd-label" for="jd-save-name">Name</label><input class="jd-input" id="jd-save-name" maxlength="80" required></div>
            <label class="jd-switch"><span>Notify me when new matches are listed</span><input type="checkbox" id="jd-save-notify" checked><span class="jd-switch__track" aria-hidden="true"></span></label>
            <div class="jd-form-note" id="jd-save-status" role="status"></div>
            <div class="jd-dialog__actions">
                <button type="button" class="jd-btn jd-btn--secondary" id="jd-save-cancel">Cancel</button>
                <button type="submit" class="jd-btn jd-btn--primary" id="jd-save-confirm">Save search</button>
            </div>
        </form>
    </dialog>

    <div id="jd-footer"></div>
    <div id="jd-bottomnav"></div>

    <script src="js/config.js"></script>
    <script src="js/supabase.js"></script>
    <script src="js/jd-core.js"></script>
    <script src="js/jd-router.js"></script>
    <script src="js/jd-data.js"></script>
    <script src="js/jd-explore.js"></script>
</body>
</html>
