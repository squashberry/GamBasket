<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
    <title>Your cart — JulaDirect</title>
    <meta name="theme-color" content="#1451e6">
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="css/jd.css">
</head>
<body class="jd">
    <div id="jd-header"></div>

    <main id="jd-main" class="jd-container">
        <nav class="jd-breadcrumb" aria-label="Breadcrumb"><a href="index.html">Home</a><span aria-hidden="true">/</span><span aria-current="page">Cart</span></nav>
        <div class="jd-page-head"><h1 style="font-size:clamp(1.6rem,3vw,2.3rem)">Your cart</h1><p id="jd-cart-sub" aria-live="polite"></p></div>
        <div id="jd-cart" aria-live="polite">
            <div class="jd-cart" aria-hidden="true">
                <div style="display:grid;gap:14px"><div class="jd-skel" style="height:130px"></div><div class="jd-skel" style="height:130px"></div></div>
                <div class="jd-skel" style="height:240px"></div>
            </div>
        </div>
    </main>

    <dialog class="jd-dialog" id="jd-clear-dialog" aria-labelledby="jd-clear-title">
        <form method="dialog">
            <div><h2 id="jd-clear-title" style="font-size:1.3rem">Clear your cart?</h2><p class="jd-muted" style="margin-top:6px">This removes every item from your cart. You can add them again from the marketplace.</p></div>
            <div class="jd-dialog__actions">
                <button type="submit" class="jd-btn jd-btn--secondary" value="cancel">Keep items</button>
                <button type="submit" class="jd-btn jd-btn--primary" value="clear" id="jd-clear-confirm">Clear cart</button>
            </div>
        </form>
    </dialog>

    <div id="jd-footer"></div>
    <div id="jd-bottomnav"></div>

    <script src="js/config.js"></script>
    <script src="js/supabase.js"></script>
    <script src="js/jd-core.js"></script>
    <script src="js/jd-data.js"></script>
    <script src="js/jd-cart.js"></script>
</body>
</html>
