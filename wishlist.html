            </div>
            <div class="notification-header-actions">
                <button class="mark-all-btn" id="markAllReadBtn" type="button">Mark all read</button>
                <button class="notification-close-btn" id="notificationCloseBtn" aria-label="Close notifications" type="button">
                    <svg viewBox="0 0 24 24" fill="none"><path d="M6 6L18 18M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
                </button>
            </div>
        </div>
        <div class="notifications-list" id="notificationsList"></div>
    </section>

    <div class="notification-toast" id="notificationToast" role="status" aria-live="polite">
        <div class="toast-icon">
            <svg viewBox="0 0 24 24" fill="none"><path d="M18 9.5C18 6.46 16.21 4 12 4C7.79 4 6 6.46 6 9.5C6 14.75 4 16 4 17.5H20C20 16 18 14.75 18 9.5Z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M10 20C10.5 20.65 11.2 21 12 21C12.8 21 13.5 20.65 14 20" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        </div>
        <div class="toast-content">
            <strong id="toastTitle">New notification</strong>
            <span id="toastMessage">You have a new notification.</span>
        </div>
        <button class="toast-close" id="toastClose" aria-label="Close" type="button">
            <svg viewBox="0 0 24 24" fill="none"><path d="M6 6L18 18M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
    </div>

    <!-- SCRIPTS LOADED IN AUTHORITATIVE ARCHITECTURAL ORDER -->
    <script src="js/config.js"></script>
    <script src="js/supabase.js"></script>
    <script src="js/auth-errors.js"></script>
    <script src="js/auth-guard.js"></script>
    <script src="js/states.js"></script>
    <script src="js/notifications.js"></script>

    <script>
        (function() {
            "use strict";

            function formatPrice(p) {
                return new Intl.NumberFormat("en-GM", { maximumFractionDigits: 0 }).format(p || 0);
            }

            async function renderWishlist() {
                const container = document.getElementById("wishlistContainer");
                const countBadge = document.getElementById("wishlistCountBadge");
                if (!container) return;

                // 1. Wait for Supabase Auth to be ready
                await window.GamBasketAuth.ready();
                const session = await window.GamBasketAuth.getSession();

                // 2. Guest state handling
                if (!session || !session.user) {
                    if (countBadge) countBadge.textContent = "Sign In Required";
                    container.innerHTML = `
                        <div style="text-align: center; padding: 70px 20px; background: var(--surface); border-radius: 24px; border: 1px solid var(--border); box-shadow: var(--shadow-small); max-width: 480px; margin: 20px auto;">
                            <div style="width: 68px; height: 68px; border-radius: 22px; background: #eff6ff; color: #2563eb; display: inline-flex; align-items: center; justify-content: center; margin-bottom: 18px;">
                                <svg class="ui-icon" style="width: 32px; height: 32px;"><use href="#icon-heart"></use></svg>
                            </div>
                            <h2 style="font-size: 20px; font-weight: 800; margin: 0 0 8px; color: var(--text);">Sign in to view your wishlist</h2>
                            <p style="color: var(--text-secondary); font-size: 14px; line-height: 1.5; margin: 0 auto 24px; max-width: 340px;">
                                Please log in to see your saved items, track price updates, and access your wishlist across all your devices.
                            </p>
                            <div style="display: flex; justify-content: center; gap: 12px; flex-wrap: wrap;">
                                <a href="login.html?redirect=wishlist.html" class="primary-btn" style="padding: 12px 26px; border-radius: 12px; font-weight: 700; text-decoration: none; font-size: 14px; background: #2563eb; color: #fff;">
                                    Log In
                                </a>
                                <a href="signup.html?redirect=wishlist.html" class="secondary-btn" style="padding: 12px 24px; border-radius: 12px; font-weight: 600; text-decoration: none; font-size: 14px; border: 1px solid var(--border); color: var(--text); background: var(--surface-secondary);">
                                    Create Account
                                </a>
                            </div>
                        </div>
                    `;
                    return;
                }

                // 3. Authenticated query to Supabase wishlist_items
                try {
                    const { data: items, count, error } = await window.GamBasketAuth.getWishlist();

                    if (error) {
                        throw error;
                    }

                    if (countBadge) {
                        countBadge.textContent = `${count} saved product${count === 1 ? "" : "s"}`;
                    }

                    // 4. Empty state
                    if (!items || items.length === 0) {
                        container.innerHTML = `
                            <div style="text-align: center; padding: 70px 20px; background: var(--surface); border-radius: 24px; border: 1px solid var(--border); box-shadow: var(--shadow-small); max-width: 500px; margin: 20px auto;">
                                <div style="width: 68px; height: 68px; border-radius: 22px; background: #eff6ff; color: #2563eb; display: inline-flex; align-items: center; justify-content: center; margin-bottom: 18px;">
                                    <svg class="ui-icon" style="width: 32px; height: 32px;"><use href="#icon-heart"></use></svg>
                                </div>
                                <h2 style="font-size: 20px; font-weight: 800; margin: 0 0 8px; color: var(--text);">Your wishlist is empty</h2>
                                <p style="color: var(--text-secondary); font-size: 14px; line-height: 1.5; margin: 0 auto 24px; max-width: 340px;">
                                    Save products you love while exploring the GamBasket marketplace and they will appear here.
                                </p>
                                <a href="explore.html" class="primary-btn" style="display: inline-flex; align-items: center; gap: 8px; padding: 13px 28px; border-radius: 12px; font-weight: 700; text-decoration: none; font-size: 14px; background: #2563eb; color: #fff;">
                                    <svg class="ui-icon" style="width: 16px; height: 16px;"><use href="#icon-search"></use></svg>
                                    <span>Explore Products</span>
                                </a>
                            </div>
                        `;
                        return;
                    }

                    // 5. Render Responsive Marketplace Grid
                    let html = `<div class="wishlist-grid">`;

                    items.forEach(product => {
                        html += `
                            <div class="wishlist-product-card" style="background: var(--surface); border-radius: 18px; border: 1px solid var(--border); overflow: hidden; display: flex; flex-direction: column; box-shadow: var(--shadow-small); transition: transform 0.2s ease, box-shadow 0.2s ease;">
                                
                                <!-- Product Image & Quick Actions -->
                                <div style="position: relative; width: 100%; height: 190px; background: var(--surface-secondary); overflow: hidden;">
                                    <img src="${product.image}" alt="${product.name}" loading="lazy" style="width: 100%; height: 100%; object-fit: cover;">
                                    
                                    <span style="position: absolute; top: 12px; left: 12px; background: rgba(15, 23, 42, 0.75); backdrop-filter: blur(8px); color: #fff; font-size: 11px; font-weight: 700; padding: 4px 10px; border-radius: 20px; text-transform: uppercase;">
                                        ${product.category || "General"}
                                    </span>

                                    <button onclick="window.removeWishlistItem('${product.id}')" aria-label="Remove from Wishlist" title="Remove from Wishlist" style="position: absolute; top: 12px; right: 12px; width: 34px; height: 34px; border-radius: 50%; background: var(--surface); border: 1px solid var(--border); color: #ef4444; display: flex; align-items: center; justify-content: center; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.1);">
                                        <svg class="ui-icon" style="width: 16px; height: 16px;"><use href="#icon-trash"></use></svg>
                                    </button>
                                </div>

                                <!-- Card Body -->
                                <div style="padding: 16px; flex: 1; display: flex; flex-direction: column; justify-content: space-between;">
                                    <div>
                                        <h3 style="font-size: 15px; font-weight: 700; color: var(--text); margin: 0 0 6px; line-height: 1.3; overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;">
                                            ${product.name}
                                        </h3>
                                        
                                        <div style="font-size: 18px; font-weight: 800; color: #2563eb; margin-bottom: 8px;">
                                            D ${formatPrice(product.price)}
                                        </div>

                                        <div style="display: flex; align-items: center; justify-content: space-between; font-size: 12px; color: var(--text-secondary); margin-bottom: 14px; gap: 6px;">
                                            <span style="display: inline-flex; align-items: center; gap: 4px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">
                                                <svg class="ui-icon" style="width: 12px; height: 12px; flex-shrink: 0; color: #2563eb;"><use href="#icon-pin"></use></svg>
                                                <span>${product.location || "Greater Banjul"}</span>
                                            </span>
                                            <span style="display: inline-flex; align-items: center; gap: 4px; font-weight: 600; background: var(--surface-secondary); padding: 2px 8px; border-radius: 6px; flex-shrink: 0;">
                                                <span>${product.condition || "New"}</span>
                                            </span>
                                        </div>
                                    </div>

                                    <!-- Actions -->
                                    <div style="display: flex; gap: 8px; margin-top: auto; padding-top: 10px; border-top: 1px solid var(--border);">
                                        <button onclick="window.addWishlistToCart('${product.id}')" style="flex: 1; padding: 10px 12px; border-radius: 10px; background: #2563eb; color: #ffffff; font-size: 13px; font-weight: 700; border: none; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 6px;">
                                            <svg class="ui-icon" style="width: 14px; height: 14px;"><use href="#icon-cart"></use></svg>
                                            <span>Add to Cart</span>
                                        </button>
                                        <a href="product.html?id=${product.id}" style="padding: 10px 12px; border-radius: 10px; background: var(--surface-secondary); color: var(--text); font-size: 13px; font-weight: 600; border: 1px solid var(--border); text-decoration: none; display: inline-flex; align-items: center; justify-content: center;">
                                            <svg class="ui-icon" style="width: 14px; height: 14px;"><use href="#icon-eye"></use></svg>
                                        </a>
                                    </div>
                                </div>
                            </div>
                        `;
                    });

                    html += `</div>`;
                    container.innerHTML = html;

                } catch (err) {
                    console.error("[GamBasket Wishlist Error]", err);
                    if (countBadge) countBadge.textContent = "Error Loading";
                    container.innerHTML = `
                        <div style="text-align: center; padding: 60px 20px; background: var(--surface); border-radius: 20px; border: 1px solid var(--border); max-width: 440px; margin: 20px auto;">
                            <div style="width: 60px; height: 60px; border-radius: 20px; background: #fee2e2; color: #ef4444; display: inline-flex; align-items: center; justify-content: center; margin-bottom: 16px;">
                                <svg class="ui-icon" style="width: 28px; height: 28px;"><use href="#icon-heart"></use></svg>
                            </div>
                            <h2 style="font-size: 19px; font-weight: 800; margin: 0 0 8px; color: var(--text);">Couldn't load your wishlist</h2>
                            <p style="color: var(--text-secondary); font-size: 13px; margin: 0 auto 20px; max-width: 300px;">
                                Please check your connection and try again.
                            </p>
                            <button onclick="window.renderWishlistPage()" class="primary-btn" style="padding: 11px 24px; border-radius: 10px; font-weight: 700; border: none; background: #2563eb; color: #fff; cursor: pointer;">
                                Try Again
                            </button>
                        </div>
                    `;
                }
            }

            // Global removal handler
            window.removeWishlistItem = async function(id) {
                try {
                    await window.GamBasketAuth.removeFromWishlist(id);
                    renderWishlist();
                } catch (e) {
                    console.warn("[GamBasket] Remove wishlist item failed:", e);
                }
            };

            // Global move to cart handler
            window.addWishlistToCart = function(id) {
                const product = window.GamBasketAuth.getProductById(id);
                if (product) {
                    let cart = JSON.parse(localStorage.getItem("gambasket_cart") || "[]");
                    const existing = cart.find(c => String(c.id) === String(product.id));
                    if (existing) {
                        existing.quantity += 1;
                    } else {
                        cart.push({
                            id: product.id,
                            name: product.name,
                            price: product.price,
                            image: product.image,
                            quantity: 1
                        });
                    }
                    localStorage.setItem("gambasket_cart", JSON.stringify(cart));
                    
                    if (window.GamBasketNotifications && typeof window.GamBasketNotifications.showToast === "function") {
                        window.GamBasketNotifications.showToast("Added to Cart", `${product.name} is in your cart.`);
                    }
                    window.location.href = "cart.html";
                }
            };

            window.renderWishlistPage = renderWishlist;

            // Navigation Links delegation
            document.querySelectorAll(".nav-item").forEach(item => {
                item.addEventListener("click", () => {
                    const page = item.dataset.page;
                    if (page === "home") window.location.href = "index.html";
                    else if (page === "explore") window.location.href = "explore.html";
                    else if (page === "orders") window.navigateProtectedPage ? window.navigateProtectedPage("orders.html", "view your orders") : window.location.href = "orders.html";
                    else if (page === "wishlist") window.location.href = "wishlist.html";
                    else if (page === "me") window.location.href = "me.html";
                });
            });

            // Listen for reactive wishlist changes and auth state changes
            window.addEventListener("gambasket:wishlist:change", renderWishlist);
            window.addEventListener("gambasket:auth:change", renderWishlist);

            // Initial render
            if (document.readyState === "loading") {
                document.addEventListener("DOMContentLoaded", renderWishlist);
            } else {
                renderWishlist();
            }
        })();
    </script>
</body>
</html>
