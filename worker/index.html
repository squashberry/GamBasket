<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Operations Center · JulaDirect</title>
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="../css/fw.css">
<link rel="stylesheet" href="../css/fw-ops.css">
</head>
<body class="fw" data-surface="ops">
<div id="fwGate" class="fw-gate">Opening Operations Center…</div>
<div id="authGate" hidden></div>

<div id="protectedContent" hidden>
  <div class="fw-app">
    <aside class="fw-rail" aria-label="Operations navigation">
      <a class="fw-brand" href="../index.html"><i>J</i>Operations</a>
      <div class="fw-who"><span class="fw-avatar" id="opsAvatar">O</span><div><b id="opsName">You</b><small>Operations worker</small></div></div>
      <nav class="fw-nav" id="opsNav">
        <a href="#/overview" data-route="overview"><span data-icon="pulse"></span>Overview</a>
        <a href="#/inbox" data-route="inbox"><span data-icon="inbox"></span>Inbox<span class="fw-badge" id="opsBadge" hidden>0</span></a>
        <a href="#/dispatch" data-route="dispatch"><span data-icon="truck"></span>Dispatch</a>
        <a href="#/earnings" data-route="earnings"><span data-icon="wallet"></span>Earnings</a>
        <a href="#/activity" data-route="activity"><span data-icon="clock"></span>Activity</a>
      </nav>
      <div class="fw-rail__foot">
        <button type="button" id="opsHelp"><span class="fw-kbd">?</span> Shortcuts</button>
        <button type="button" id="opsTheme">Dark / light mode</button>
        <a href="../me.html">← Leave workspace</a>
      </div>
    </aside>
    <div class="fw-main">
      <header class="fw-top">
        <h1 id="fwTitle">Overview</h1>
        <div class="fw-top__space"></div>
        <button class="fw-icon-btn" id="opsThemeTop" type="button" aria-label="Toggle dark mode"><span data-icon="moon"></span></button>
      </header>
      <main class="fw-content">
        <section class="fw-view" id="v-overview" hidden></section>
        <section class="fw-view" id="v-inbox" hidden></section>
        <section class="fw-view" id="v-dispatch" hidden></section>
        <section class="fw-view" id="v-earnings" hidden></section>
        <section class="fw-view" id="v-activity" hidden></section>
      </main>
    </div>
  </div>
  <nav class="fw-tabbar" aria-label="Operations navigation">
    <a href="#/overview" data-route="overview"><span data-icon="pulse"></span>Overview</a>
    <a href="#/inbox" data-route="inbox"><span data-icon="inbox"></span>Inbox<span class="fw-badge" id="opsTabBadge" hidden>0</span></a>
    <a href="#/dispatch" data-route="dispatch"><span data-icon="truck"></span>Dispatch</a>
    <a href="#/earnings" data-route="earnings"><span data-icon="wallet"></span>Earnings</a>
    <a href="#/activity" data-route="activity"><span data-icon="clock"></span>Activity</a>
  </nav>
</div>

<script src="../js/config.js"></script>
<script src="../js/supabase.js"></script>
<script src="../js/auth-errors.js"></script>
<script src="../js/auth-guard.js"></script>
<script src="../js/fw-core.js"></script>
<script src="../js/fw-ops.js"></script>
</body>
</html>
