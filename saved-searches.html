<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
    <title>Saved searches &amp; price alerts — JulaDirect</title>
    <meta name="robots" content="noindex">
    <meta name="theme-color" content="#1451e6">
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="css/jd.css">
    <link rel="stylesheet" href="css/jd-account.css">
</head>
<body class="jd">
    <div id="jd-header"></div>

    <main id="jd-main" class="jd-container">
        <nav class="jd-breadcrumb" aria-label="Breadcrumb"><a href="index.html">Home</a><span aria-hidden="true">/</span><a href="me.html">Account</a><span aria-hidden="true">/</span><span aria-current="page">Saved searches</span></nav>
        <div id="jd-acctnav"></div>
        <div class="ac-pagehead">
            <h1>Saved searches &amp; price alerts</h1>
            <p>Come back to the searches you care about, choose which ones alert you to new listings, and see price drops on products in your wishlist.</p>
        </div>

        <div id="ss-state" aria-live="polite"></div>
        <div class="ac-wide" id="ss-body" hidden>
            <section class="ac-card" aria-labelledby="h-searches">
                <div class="ac-card__head"><h2 id="h-searches">Saved searches <span class="jd-muted" id="ss-count" style="font-weight:600"></span></h2><a class="ac-link" href="explore.html">Explore products &rarr;</a></div>
                <div id="ss-list"></div>
            </section>
            <section class="ac-card" aria-labelledby="h-alerts">
                <div class="ac-card__head"><h2 id="h-alerts">Price-drop alerts</h2><span class="ac-card__act"><button class="ac-link" type="button" id="ss-read" hidden>Mark all read</button><a class="ac-link" href="wishlist.html">Manage wishlist &rarr;</a></span></div>
                <div id="ss-alerts"></div>
            </section>
        </div>
    </main>

    <dialog class="jd-dialog" id="ss-confirm" aria-labelledby="ss-confirm-title">
        <div><h2 id="ss-confirm-title" style="font-size:1.3rem">Delete this saved search?</h2><p class="jd-muted" id="ss-confirm-text" style="margin-top:6px"></p></div>
        <div class="jd-dialog__actions" style="margin-top:18px">
            <button type="button" class="jd-btn jd-btn--secondary" id="ss-confirm-cancel">Keep it</button>
            <button type="button" class="jd-btn jd-btn--primary" id="ss-confirm-ok">Delete</button>
        </div>
    </dialog>

    <div id="jd-footer"></div>
    <div id="jd-bottomnav"></div>

    <script src="js/config.js"></script>
    <script src="js/supabase.js"></script>
    <script src="js/jd-core.js"></script>
    <script src="js/jd-data.js"></script>
    <script src="js/account-searches.js"></script>
</body>
</html>
