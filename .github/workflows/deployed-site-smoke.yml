name: JulaDirect deployed Pages smoke checks

on:
  workflow_dispatch:
    inputs:
      site_url:
        description: HTTPS base URL of the deployed JulaDirect site
        required: false
        type: string
        default: "https://juladirect.pages.dev/"
  schedule:
    - cron: "41 9 * * *"

permissions:
  contents: read

concurrency:
  group: juladirect-deployed-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deployed-site:
    name: Verify actual Cloudflare Pages deployment
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout deployed revision
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Smoke-test deployed routes and assets
        env:
          JULADIRECT_SITE_URL: ${{ inputs.site_url || 'https://juladirect.pages.dev/' }}
        run: node tests/deployed-site-smoke.mjs
