<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Seller Studio — JulaDirect</title>
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="../css/sx.css">
<script>
(function () {
  try {
    var t = localStorage.getItem("gambasket-theme");
    if (t === "dark" || (!t && window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches)) document.documentElement.classList.add("dark");
  } catch (e) { /* storage unavailable */ }
})();
</script>
</head>
<body class="sx">

<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <symbol id="i-home" viewBox="0 0 24 24"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v9.5h13V10"/></symbol>
  <symbol id="i-orders" viewBox="0 0 24 24"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/></symbol>
  <symbol id="i-box" viewBox="0 0 24 24"><path d="M4 7.5 12 3l8 4.5v9L12 21l-8-4.5z"/><path d="M4.4 7.7 12 12l7.6-4.3M12 12v9"/></symbol>
  <symbol id="i-people" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.2"/><path d="M3 19c.6-3.3 2.8-5 6-5s5.4 1.7 6 5"/><path d="M16 5.2a3 3 0 0 1 0 5.6M18 14.4c1.8.6 2.8 2.1 3 4.6"/></symbol>
  <symbol id="i-star" viewBox="0 0 24 24"><path d="m12 3.5 2.7 5.5 6 .9-4.4 4.2 1 6-5.3-2.8-5.3 2.8 1-6L3.3 9.9l6-.9z"/></symbol>
  <symbol id="i-wallet" viewBox="0 0 24 24"><path d="M4 7a2 2 0 0 1 2-2h12v3"/><rect x="3" y="8" width="18" height="12" rx="2.5"/><circle cx="16.5" cy="14" r="1.2"/></symbol>
  <symbol id="i-more" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="19" cy="12" r="1.4"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="i-moon" viewBox="0 0 24 24"><path d="M20 14.6A8.3 8.3 0 0 1 9.4 4 8.3 8.3 0 1 0 20 14.6Z"/></symbol>
  <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></symbol>
  <symbol id="i-bag" viewBox="0 0 24 24"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><path d="M3 6h18"/><path d="M16 10a4 4 0 0 1-8 0"/></symbol>
</defs></svg>

<div id="sxGate" style="min-height:100vh;display:grid;place-items:center;font-family:system-ui,sans-serif;color:#7b8394">Loading your studio…</div>

<div class="sx-app" id="sxApp" hidden>
  <aside class="sx-rail" aria-label="Seller navigation">
    <a class="sx-brand" href="../index.html" title="Back to JulaDirect"><i><svg><use href="#i-bag"/></svg></i>Seller Studio</a>
    <div class="sx-store">
      <div class="sx-store__logo" id="sxStoreLogo">J</div>
      <div><b id="sxStoreName">Your store</b><small id="sxStoreMeta">Seller account</small></div>
    </div>
    <nav class="sx-nav" id="sxNav">
      <a href="#/overview" data-route="overview"><svg><use href="#i-home"/></svg>Overview</a>
      <a href="#/orders" data-route="orders"><svg><use href="#i-orders"/></svg>Orders<span class="sx-badge" id="sxBadgeOrders" hidden>0</span></a>
      <a href="#/products" data-route="products"><svg><use href="#i-box"/></svg>Products<span class="sx-badge" id="sxBadgeProducts" hidden>0</span></a>
      <a href="#/customers" data-route="customers"><svg><use href="#i-people"/></svg>Customers</a>
      <a href="#/reviews" data-route="reviews"><svg><use href="#i-star"/></svg>Reviews<span class="sx-badge" id="sxBadgeReviews" hidden>0</span></a>
      <a href="#/earnings" data-route="earnings"><svg><use href="#i-wallet"/></svg>Earnings</a>
      <div class="sx-nav__label">Manage</div>
      <a href="messages.html"><svg><use href="#i-orders"/></svg>Messages</a>
      <a href="store.html"><svg><use href="#i-bag"/></svg>Store profile</a>
      <a href="website.html"><svg><use href="#i-home"/></svg>Business website</a>
      <a href="pickup-delivery.html"><svg><use href="#i-box"/></svg>Pickup &amp; delivery</a>
      <a href="settings.html"><svg><use href="#i-more"/></svg>Settings</a>
    </nav>
    <div class="sx-rail__foot">
      <a href="../index.html">← Back to marketplace</a>
      <a href="../help.html">Help &amp; seller guide</a>
    </div>
  </aside>

  <div class="sx-main">
    <header class="sx-top">
      <h1 id="sxTitle">Overview</h1>
      <div class="sx-top__space"></div>
      <div class="sx-seg" id="sxPeriod" role="group" aria-label="Period">
        <button type="button" data-days="7" aria-pressed="false">7d</button>
        <button type="button" data-days="30" aria-pressed="true">30d</button>
        <button type="button" data-days="90" aria-pressed="false">90d</button>
      </div>
      <button class="sx-icon-btn" id="sxTheme" type="button" aria-label="Toggle dark mode"><svg><use href="#i-moon"/></svg></button>
      <a class="sx-btn sx-btn--primary" href="add-product.html"><svg><use href="#i-plus"/></svg><span class="sx-hide-sm">Add product</span></a>
    </header>

    <main class="sx-content" id="sxContent">
      <section class="sx-view" id="v-overview" hidden></section>
      <section class="sx-view" id="v-orders" hidden></section>
      <section class="sx-view" id="v-products" hidden></section>
      <section class="sx-view" id="v-customers" hidden></section>
      <section class="sx-view" id="v-reviews" hidden></section>
      <section class="sx-view" id="v-earnings" hidden></section>
      <section class="sx-view" id="v-more" hidden></section>
    </main>
  </div>
</div>

<nav class="sx-tabbar" id="sxTabbar" aria-label="Seller navigation" hidden>
  <a href="#/overview" data-route="overview"><svg><use href="#i-home"/></svg>Home</a>
  <a href="#/orders" data-route="orders"><svg><use href="#i-orders"/></svg>Orders<span class="sx-badge" id="sxTabBadge" hidden>0</span></a>
  <a href="#/products" data-route="products"><svg><use href="#i-box"/></svg>Products</a>
  <a href="#/reviews" data-route="reviews"><svg><use href="#i-star"/></svg>Reviews</a>
  <a href="#/more" data-route="more"><svg><use href="#i-more"/></svg>More</a>
</nav>

<div class="sx-scrim" id="sxScrim"></div>
<aside class="sx-drawer" id="sxDrawer" aria-hidden="true" role="dialog" aria-modal="true" aria-labelledby="sxDrawerTitle">
  <div class="sx-drawer__head"><h2 id="sxDrawerTitle"></h2><button class="sx-icon-btn" id="sxDrawerClose" type="button" aria-label="Close"><svg><use href="#i-close"/></svg></button></div>
  <div class="sx-drawer__body" id="sxDrawerBody"></div>
  <div class="sx-drawer__foot" id="sxDrawerFoot"></div>
</aside>
<div class="sx-toasts" id="sxToasts" aria-live="polite"></div>

<script src="../js/config.js"></script>
<script src="../js/supabase.js"></script>
<script src="../js/auth-errors.js"></script>
<script src="../js/auth-guard.js"></script>
<script src="../js/sx-data.js"></script>
<script src="../js/sx-app.js"></script>
</body>
</html>
