<div class="auth-page">


    <!-- TOP BAR -->

    <header class="auth-topbar">

        <a
            href="index.html"
            class="auth-logo"
        >
            <span>GamB</span><svg class="brand-bag-icon" viewBox="0 0 24 24" fill="none" stroke="#2563eb" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="width:20px;height:20px;margin:0 1px;display:inline-block;vertical-align:middle;"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg><span>sket</span>
        </a>


        <div class="auth-top-actions">

            <button
                class="theme-toggle"
                id="themeToggle"
                type="button"
                aria-label="Toggle dark mode"
            >

                <svg
                    viewBox="0 0 24 24"
                    fill="none"
                >

                    <circle
                        cx="12"
                        cy="12"
                        r="4"
                        stroke="currentColor"
                        stroke-width="1.7"
                    />

                    <path
                        d="M12 2V4"
                        stroke="currentColor"
                        stroke-width="1.7"
                        stroke-linecap="round"
                    />

                    <path
                        d="M12 20V22"
                        stroke="currentColor"
                        stroke-width="1.7"
                        stroke-linecap="round"
                    />

                    <path
                        d="M4.93 4.93L6.34 6.34"
                        stroke="currentColor"
                        stroke-width="1.7"
                        stroke-linecap="round"
                    />

                    <path
                        d="M17.66 17.66L19.07 19.07"
                        stroke="currentColor"
                        stroke-width="1.7"
                        stroke-linecap="round"
                    />

                    <path
                        d="M2 12H4"
                        stroke="currentColor"
                        stroke-width="1.7"
                        stroke-linecap="round"
                    />

                    <path
                        d="M20 12H22"
                        stroke="currentColor"
                        stroke-width="1.7"
                        stroke-linecap="round"
                    />

                </svg>

            </button>

        </div>

    </header>


    <!-- MAIN -->

    <main class="auth-main">

        <div class="auth-container">


            <div class="auth-mark">

                <svg
                    viewBox="0 0 24 24"
                    fill="none"
                >

                    <path
                        d="M5 8H19L18 20H6L5 8Z"
                        stroke="currentColor"
                        stroke-width="1.8"
                        stroke-linejoin="round"
                    />

                    <path
                        d="M9 9V6C9 4.34 10.34 3 12 3C13.66 3 15 4.34 15 6V9"
                        stroke="currentColor"
                        stroke-width="1.8"
                        stroke-linecap="round"
                    />

                </svg>

            </div>


            <div class="auth-heading">

                <h1>
                    Welcome back
                </h1>

                <p>
                    Log in to continue exploring
                    <span>GamB</span><svg class="brand-bag-icon" viewBox="0 0 24 24" fill="none" stroke="#2563eb" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="width:20px;height:20px;margin:0 1px;display:inline-block;vertical-align:middle;"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg><span>sket</span>.
                </p>

            </div>


            <div class="auth-card">

                <button
                    class="google-btn"
                    id="googleLoginBtn"
                    type="button"
                    aria-label="Continue with Google"
                >
                    <svg class="google-icon" viewBox="0 0 24 24">
                        <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
                        <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                        <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z" fill="#FBBC05"/>
                        <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z" fill="#EA4335"/>
                    </svg>
                    <span>Continue with Google</span>
                </button>

                <div class="auth-divider" style="margin: 16px 0;">
                    <span>OR</span>
                </div>

                <form
                    class="auth-form"
                    id="loginForm"
                >

                    <div
                        class="form-error"
                        id="loginError"
                    ></div>

                    <!-- EMAIL -->

                    <div class="field">

                        <label
                            class="field-label"
                            for="loginEmail"
                        >
                            Email address
                        </label>

                        <div class="field-wrap">

                            <input
                                id="loginEmail"
                                type="email"
                                placeholder="you@example.com"
                                autocomplete="email"
                            >

                        </div>

                    </div>


                    <!-- PASSWORD -->

                    <div class="field">

                        <label
                            class="field-label"
                            for="loginPassword"
                        >
                            Password
                        </label>

                        <div class="field-wrap">

                            <input
                                id="loginPassword"
                                class="password-input"
                                type="password"
                                placeholder="Enter your password"
                                autocomplete="current-password"
                            >

                            <button
                                class="password-toggle"
                                type="button"
                                data-target="loginPassword"
                                aria-label="Show password"
                            >

                                <svg
                                    viewBox="0 0 24 24"
                                    fill="none"
                                >

                                    <path
                                        d="M2.5 12C4.5 8.2 7.6 6 12 6C16.4 6 19.5 8.2 21.5 12C19.5 15.8 16.4 18 12 18C7.6 18 4.5 15.8 2.5 12Z"
                                        stroke="currentColor"
                                        stroke-width="1.7"
                                        stroke-linejoin="round"
                                    />

                                    <circle
                                        cx="12"
                                        cy="12"
                                        r="2.5"
                                        stroke="currentColor"
                                        stroke-width="1.7"
                                    />

                                </svg>

                            </button>

                        </div>

                    </div>


                    <div class="forgot-row">

                        <a
                            href="forgot-password.html"
                            class="auth-link"
                        >
                            Forgot password?
                        </a>

                    </div>


                    <button
                        class="primary-btn"
                        id="loginButton"
                        type="submit"
                    >
                        Log in

                        <svg
                            viewBox="0 0 24 24"
                            fill="none"
                        >

                            <path
                                d="M5 12H19"
                                stroke="currentColor"
                                stroke-width="1.8"
                                stroke-linecap="round"
                            />

                            <path
                                d="M13 6L19 12L13 18"
                                stroke="currentColor"
                                stroke-width="1.8"
                                stroke-linecap="round"
                                stroke-linejoin="round"
                            />

                        </svg>

                    </button>


                    <div class="auth-divider">

                        <span>OR</span>

                    </div>


                    <a
                        href="signup.html"
                        class="secondary-btn"
                        style="
                            display:flex;
                            align-items:center;
                            justify-content:center;
                            text-decoration:none;
                        "
                    >
                        Create a <span>GamB</span><svg class="brand-bag-icon" viewBox="0 0 24 24" fill="none" stroke="#2563eb" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="width:20px;height:20px;margin:0 1px;display:inline-block;vertical-align:middle;"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg><span>sket</span> account
                    </a>

                </form>

            </div>


            <div class="auth-bottom">

                By continuing, you agree to
                <span>GamB</span><svg class="brand-bag-icon" viewBox="0 0 24 24" fill="none" stroke="#2563eb" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="width:20px;height:20px;margin:0 1px;display:inline-block;vertical-align:middle;"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg><span>sket</span>'s
                <a href="#" class="auth-link">
                    Terms
                </a>
                and
                <a href="#" class="auth-link">
                    Privacy Policy
                </a>.

            </div>


        </div>

    </main>
