name: GamBasket validation

on:
  push:
    branches:
      - main
      - fix/security-and-backend-hardening
      - stage-a-b-product-quality
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gambasket-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  syntax-and-contracts:
    name: Frontend syntax and critical contracts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check every JavaScript file
        shell: bash
        run: |
          set -euo pipefail
          count=0
          while IFS= read -r -d '' file; do
            node --check "$file"
            count=$((count + 1))
          done < <(find js -type f -name '*.js' -print0 | sort -z)
          node --check tests/marketplace-smoke.spec.js
          node --check tests/static-server.mjs
          node --check tests/live-supabase-contract.mjs
          node --check tests/deployed-site-smoke.mjs
          echo "Successfully syntax-checked $count application JavaScript files plus browser test scripts."

      - name: Check inline scripts on changed workflow pages
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          import subprocess
          import tempfile

          class ScriptParser(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=False)
                  self.scripts = []
                  self.current = None
              def handle_starttag(self, tag, attrs):
                  if tag.lower() == "script":
                      attrs = dict(attrs)
                      if "src" not in attrs and attrs.get("type", "").lower() not in {
                          "application/json", "application/ld+json", "importmap"
                      }:
                          self.current = {"type": attrs.get("type", "").lower(), "parts": []}
              def handle_data(self, data):
                  if self.current is not None:
                      self.current["parts"].append(data)
              def handle_endtag(self, tag):
                  if tag.lower() == "script" and self.current is not None:
                      self.scripts.append(self.current)
                      self.current = None

          pages = [
              "worker-apply.html", "quick-sell.html", "supplier/add-product.html",
              "product.html", "explore.html", "compare.html", "saved-searches.html"
          ]
          checked = 0
          for page in pages:
              parser = ScriptParser()
              parser.feed(Path(page).read_text(encoding="utf-8"))
              for index, script in enumerate(parser.scripts, 1):
                  suffix = ".mjs" if script["type"] == "module" else ".js"
                  with tempfile.NamedTemporaryFile("w", suffix=suffix, encoding="utf-8", delete=False) as f:
                      f.write("\n".join(script["parts"]))
                      filename = f.name
                  subprocess.run(["node", "--check", filename], check=True)
                  checked += 1
          print(f"Successfully syntax-checked {checked} inline scripts across {len(pages)} HTML pages.")
          PY

      - name: Guard public frontend against server secrets
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -n -E 'sb_secret_[A-Za-z0-9_-]+|SUPABASE_SERVICE_ROLE_KEY|service_role' js --include='*.js'; then
            echo "Potential Supabase server secret found in browser JavaScript."
            exit 1
          fi
          echo "No Supabase server-secret patterns found in browser JavaScript."

      - name: Check security migration and client contracts
        run: |
          python3 - <<'PY'
          from pathlib import Path

          import re

          migrations = sorted(Path("supabase/migrations").glob("*.sql"))
          assert migrations, "No version-controlled SQL migrations found."
          versions = []
          for migration in migrations:
              match = re.match(r"^(\d{14})_", migration.name)
              assert match, f"Migration filename must begin with a 14-digit timestamp: {migration.name}"
              versions.append(match.group(1))
          duplicates = sorted({version for version in versions if versions.count(version) > 1})
          assert not duplicates, f"Duplicate Supabase migration timestamps found: {duplicates}"
          all_sql = "\n".join(p.read_text(encoding="utf-8") for p in migrations)
          checks = {
              "profile privacy projection": "public_profiles" in all_sql and "profiles_owner_or_admin_select" in all_sql,
              "buyer order cancellation RPC": "FUNCTION public.cancel_order" in all_sql,
              "server-side checkout RPC": "FUNCTION public.create_order" in all_sql,
              "courier identity derived from auth": "FUNCTION public.claim_delivery_job" in all_sql and "v_user uuid := auth.uid()" in all_sql,
              "verification submission RPC": "FUNCTION public.submit_verification_request" in all_sql,
              "private verification bucket": "INSERT INTO storage.buckets(id,name,public,file_size_limit,allowed_mime_types)" in all_sql and "'verification-documents',\n  'verification-documents',\n  false," in all_sql,
              "role table write revocation": "REVOKE ALL ON TABLE public.user_roles FROM PUBLIC, anon, authenticated" in all_sql,
              "admin-only audit read policy": "platform_audit_logs_admin_read" in all_sql,
              "affiliate payout reconciliation": "FUNCTION public.admin_mark_affiliate_payout_paid" in all_sql,
              "multi-photo image relation": "public.product_images" in all_sql and "product_images_public_or_owner_read" in all_sql,
              "category-specific attributes": "category_attribute_definitions" in all_sql and "ADD COLUMN IF NOT EXISTS attributes jsonb" in all_sql,
              "per-user saved searches": "CREATE TABLE IF NOT EXISTS public.saved_searches" in all_sql and "saved_searches_read_own" in all_sql,
              "moderated price-drop alerts": "notify_price_drop_after_approval" in all_sql and "product_price_change_events" in all_sql,
              "private upload ownership": "gambasket_product_images_owner_insert" in all_sql and "(storage.foldername(name))[1]=(SELECT auth.uid())::text" in all_sql,
              "price alerts update is limited": "GRANT UPDATE (is_read) ON TABLE public.wishlist_alerts TO authenticated" in all_sql,
              "upload fallback works without Cloudinary": "from(\"product-images\")" in Path("js/supabase.js").read_text(encoding="utf-8"),
              "delivery availability is a product field": "ADD COLUMN IF NOT EXISTS delivery_available boolean NOT NULL DEFAULT false" in all_sql,
              "safe public seller badges": "ADD COLUMN IF NOT EXISTS is_seller_verified boolean NOT NULL DEFAULT false" in all_sql and "ADD COLUMN IF NOT EXISTS has_business_store boolean NOT NULL DEFAULT false" in all_sql,
              "coupon validation is authenticated only": "REVOKE ALL ON FUNCTION public.validate_coupon(character varying,numeric) FROM PUBLIC, anon" in all_sql,
              "internal accounting tables deny client access": all(token in all_sql for token in ["deny_client_access ON public.affiliate_commissions", "deny_client_access ON public.campaign_products", "deny_client_access ON public.earning_rules", "deny_client_access ON public.payout_requests"]),
              "online methods fail closed until launch": all(token in all_sql for token in ["guard_available_checkout_payment_method", "NEW.payment_method IS DISTINCT FROM 'cash_on_delivery'", "orders_available_payment_methods_only"]),
          }
          for label, passed in checks.items():
              print(("PASS" if passed else "FAIL") + ": " + label)
          assert all(checks.values()), "A required backend security/workflow contract is missing."
          config = Path("js/config.js").read_text(encoding="utf-8")
          assert "CLOUDINARY_CLOUD_NAME" in config and "CLOUDINARY_UPLOAD_PRESET" in config, (
              "Optional Cloudinary configuration keys should remain available."
          )
          print(f"Validated {len(checks)} backend contracts across {len(migrations)} SQL migration files.")

          checkout = Path("checkout.html").read_text(encoding="utf-8")
          def radio_tag(element_id):
              return re.search(r"<input\\b(?=[^>]*\\bid=['\\\"]" + re.escape(element_id) + r"['\\\"])[^>]*>", checkout, re.IGNORECASE)
          cod = radio_tag("cod")
          assert cod and re.search(r"\\bchecked\\b", cod.group(0), re.IGNORECASE), "Cash on Delivery must be selected by default."
          assert not re.search(r"\\bdisabled\\b", cod.group(0), re.IGNORECASE), "Cash on Delivery must remain enabled."
          for provider in ("wave", "qmoney", "afrimoney"):
              radio = radio_tag(provider)
              assert radio and re.search(r"\\bdisabled\\b", radio.group(0), re.IGNORECASE), f"{provider} must remain disabled until launch."
              label = re.search(r"<label\\b[^>]*\\bfor=['\\\"]" + re.escape(provider) + r"['\\\"][^>]*>[\\s\\S]*?</label>", checkout, re.IGNORECASE)
              assert label and "Coming soon" in label.group(0), f"{provider} must be visibly marked Coming soon."
          assert "paymentAvailabilityNote" in checkout, "Checkout must explain the currently available payment method."
          print("Validated checkout payment availability: Cash on Delivery enabled; Wave, QMoney and Afrimoney disabled and labelled Coming soon.")
          PY
