<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0f1a2b">
<title>Courier Workspace · JulaDirect</title>
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="../css/fw.css">
<link rel="stylesheet" href="../css/fw-courier.css">
</head>
<body class="fw" data-surface="courier">

<div id="fwGate" class="fw-gate">Loading your workspace…</div>
<div id="authGate" hidden></div>

<div id="protectedContent" hidden>
  <div class="fw-app">
    <aside class="fw-rail" aria-label="Courier navigation">
      <a class="fw-brand" href="../index.html" title="Back to JulaDirect"><i>J</i>Courier</a>
      <div class="fw-who"><div class="fw-avatar" id="cwAvatar">C</div><div><b id="cwName">Courier</b><small id="cwState">Offline</small></div></div>
      <nav class="fw-nav" id="cwNav">
        <a href="#/home" data-route="home"><span data-icon="home"></span>Home</a>
        <a href="#/jobs" data-route="jobs"><span data-icon="bag"></span>Jobs<span class="fw-badge" id="cwJobsBadge" hidden>0</span></a>
        <a href="#/run" data-route="run"><span data-icon="route"></span>Current run<span class="fw-dot fw-dot--on cw-run-dot" id="cwRunDot" hidden></span></a>
        <a href="#/earnings" data-route="earnings"><span data-icon="wallet"></span>Earnings</a>
        <a href="#/history" data-route="history"><span data-icon="clock"></span>History</a>
        <a href="#/profile" data-route="profile"><span data-icon="user"></span>Profile</a>
      </nav>
      <div class="fw-rail__foot">
        <a href="../me.html">← My account</a>
        <a href="../help.html">Help</a>
      </div>
    </aside>

    <div class="fw-main">
      <header class="fw-top">
        <h1 id="fwTitle">Home</h1>
        <div class="fw-top__space"></div>
        <span class="fw-pill" id="cwTopState"><i class="fw-dot"></i> Offline</span>
        <button class="fw-icon-btn" id="cwTheme" type="button" aria-label="Toggle dark mode"><span data-icon="moon"></span></button>
      </header>
      <main class="fw-content">
        <section class="fw-view" id="v-home" hidden></section>
        <section class="fw-view" id="v-jobs" hidden></section>
        <section class="fw-view" id="v-run" hidden></section>
        <section class="fw-view" id="v-earnings" hidden></section>
        <section class="fw-view" id="v-history" hidden></section>
        <section class="fw-view" id="v-profile" hidden></section>
      </main>
    </div>
  </div>

  <nav class="fw-tabbar" aria-label="Courier navigation" id="cwTabbar">
    <a href="#/home" data-route="home"><span data-icon="home"></span>Home</a>
    <a href="#/jobs" data-route="jobs"><span data-icon="bag"></span>Jobs<span class="fw-badge" id="cwJobsBadgeM" hidden>0</span></a>
    <a href="#/run" data-route="run"><span data-icon="route"></span>Run<span class="fw-dot fw-dot--on cw-run-dot" id="cwRunDotM" hidden></span></a>
    <a href="#/earnings" data-route="earnings"><span data-icon="wallet"></span>Earnings</a>
    <a href="#/profile" data-route="profile"><span data-icon="user"></span>Me</a>
  </nav>
</div>

<script src="../js/config.js"></script>
<script src="../js/supabase.js"></script>
<script src="../js/auth-errors.js"></script>
<script src="../js/auth-guard.js"></script>
<script src="../js/fw-core.js"></script>
<script src="../js/fw-courier.js"></script>
</body>
</html>
