<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
    <title>Storefront — GamBasket</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/seller.css">
    <script>if (localStorage.getItem("gambasket-theme") === "dark") document.documentElement.classList.add("dark");</script>
</head>
<body>
    <header class="desktop-app-header">
        <a href="index.html" class="desktop-app-brand"><span>GamB</span><svg class="brand-bag-icon" viewBox="0 0 24 24" fill="none" stroke="#2563eb" stroke-width="2.2"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg><span>sket</span></a>
        <div class="desktop-app-search"><a href="explore.html" class="desktop-search-fake-input">Search Gambian products, electronics, fashion...</a></div>
        <nav class="desktop-app-nav"><a href="index.html" class="desktop-app-nav-link">Home</a><a href="explore.html" class="desktop-app-nav-link">Explore</a><a href="orders.html" class="desktop-app-nav-link">Orders</a><a href="wishlist.html" class="desktop-app-nav-link">Wishlist</a><a href="me.html" class="desktop-app-nav-link">Me</a></nav>
        <div class="desktop-app-actions">
            <button class="icon-button" id="desktopThemeToggle" type="button" aria-label="Toggle dark mode"><svg class="ui-icon"><use href="#icon-moon"></use></svg></button>
            <a href="cart.html" class="icon-button">Cart</a>
        </div>
    </header>

    <main class="page-container" style="max-width:1100px;margin:24px auto;padding:0 16px;">
        <!-- COVER & STORE HEADER -->
        <div style="border-radius:20px;overflow:hidden;border:1px solid var(--border);background:var(--surface);margin-bottom:24px;">
            <img id="pubCover" src="https://images.unsplash.com/photo-1555421689-491a97ff2040?auto=format&fit=crop&w=1200&q=80" style="width:100%;height:180px;object-fit:cover;">
            <div style="padding:20px 24px;display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-top:-40px;">
                <div style="display:flex;gap:16px;align-items:flex-end;">
                    <img id="pubLogo" src="https://images.unsplash.com/photo-1472851294608-062f824d29cc?auto=format&fit=crop&w=160&q=80" style="width:80px;height:80px;border-radius:50%;border:4px solid var(--surface);object-fit:cover;background:var(--surface);">
                    <div>
                        <div style="display:flex;align-items:center;gap:8px;">
                            <h1 id="pubName" style="margin:0;font-size:24px;font-weight:850;">GamBasket Store</h1>
                            <span class="seller-status success">VERIFIED</span>
                        </div>
                        <p id="pubLoc" style="margin:4px 0 0;font-size:12px;color:var(--text-secondary);">Kairaba Avenue, Serrekunda • 🇬🇲 The Gambia</p>
                    </div>
                </div>
                <div style="display:flex;gap:8px;">
                    <button id="msgSellerBtn" class="seller-button seller-button-primary" type="button">💬 Message Seller</button>
                </div>
            </div>
            <p id="pubDesc" style="padding:0 24px 20px;margin:0;font-size:13px;color:var(--text-secondary);max-width:700px;line-height:1.5;">Welcome to our official verified merchant store on GamBasket.</p>
        </div>

        <!-- PRODUCTS CATALOG -->
        <div>
            <h2 style="font-size:18px;font-weight:800;margin-bottom:16px;">Available Products</h2>
            <div id="storeProductsContainer" class="seller-product-list">
                <div style="grid-column:1/-1;text-align:center;padding:40px;color:var(--text-secondary);">Loading seller inventory...</div>
            </div>
        </div>
    </main>

    
    <svg width="0" height="0" style="position:absolute;display:none;" aria-hidden="true"><defs>
        <symbol id="icon-dashboard" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1" fill="none" stroke="currentColor" stroke-width="1.8"/><rect x="14" y="3" width="7" height="7" rx="1" fill="none" stroke="currentColor" stroke-width="1.8"/><rect x="3" y="14" width="7" height="7" rx="1" fill="none" stroke="currentColor" stroke-width="1.8"/><rect x="14" y="14" width="7" height="7" rx="1" fill="none" stroke="currentColor" stroke-width="1.8"/></symbol>
        <symbol id="icon-box" viewBox="0 0 24 24"><path d="M4 7.5 12 3l8 4.5v9L12 21l-8-4.5v-9Z" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M4.4 7.7 12 12l7.6-4.3M12 12v9" fill="none" stroke="currentColor" stroke-width="1.8"/></symbol>
        <symbol id="icon-orders" viewBox="0 0 24 24"><path d="M5 3h14v18H5z" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M8 8h8M8 12h8M8 16h5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
        <symbol id="icon-chat" viewBox="0 0 24 24"><path d="M21 11.5a8.5 8.5 0 0 1-8.5 8.5 8.4 8.4 0 0 1-3.8-.9L3 21l1.9-5.7a8.4 8.4 0 0 1-.9-3.8A8.5 8.5 0 0 1 12.5 3h.5a8.48 8.48 0 0 1 8 8.5Z" fill="none" stroke="currentColor" stroke-width="1.8"/></symbol>
        <symbol id="icon-wallet" viewBox="0 0 24 24"><path d="M4 6a2 2 0 0 1 2-2h13v16H6a2 2 0 0 1-2-2V6Z" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M4 7h12a2 2 0 0 1 2 2v3H4z" fill="none" stroke="currentColor" stroke-width="1.8"/></symbol>
        <symbol id="icon-store" viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V9Z" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M9 22V12h6v10" fill="none" stroke="currentColor" stroke-width="1.8"/></symbol>
        <symbol id="icon-settings" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 3Z" fill="none" stroke="currentColor" stroke-width="1.8"/></symbol>
        <symbol id="icon-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M5 20c.6-3.6 3.1-5.5 7-5.5s6.4 1.9 7 5.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
        <symbol id="icon-card" viewBox="0 0 24 24"><rect x="1" y="4" width="22" height="16" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"/><line x1="1" y1="10" x2="23" y2="10" stroke="currentColor" stroke-width="1.8"/></symbol>
        <symbol id="icon-sparkle" viewBox="0 0 24 24"><path d="m12 3 1.5 5.5L19 10l-5.5 1.5L12 17l-1.5-5.5L5 10l5.5-1.5L12 3ZM19 15l.7 2.3L22 18l-2.3.7L19 21l-.7-2.3L16 18l2.3-.7L19 15Z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></symbol>
        <symbol id="icon-moon" viewBox="0 0 24 24"><path d="M20 15.2A8.3 8.3 0 0 1 8.8 4a8.3 8.3 0 1 0 11.2 11.2Z" fill="none" stroke="currentColor" stroke-width="1.8"/></symbol>
    </defs></svg>

    <script src="js/config.js"></script><script src="js/supabase.js"></script><script src="js/auth-errors.js"></script><script src="js/auth-guard.js"></script><script src="js/states.js"></script><script src="js/seller-store.js"></script>
    <script>
    (async () => {
        "use strict";
        const sellerId = new URLSearchParams(window.location.search).get("id");
        try {
            const store = await window.GamBasketSellerStore.getStore(sellerId);
            document.getElementById("pubName").textContent = store.name;
            document.getElementById("pubLoc").textContent = store.location + " • 🇬🇲 The Gambia";
            document.getElementById("pubDesc").textContent = store.description;

            // Load products
            await window.GamBasketAuth.ready();
            const client = window.GamBasketAuth.getClient();
            const { data: prods } = await client.from("products").select("*").eq("seller_id", sellerId || store.id).limit(20);

            const container = document.getElementById("storeProductsContainer");
            if (!prods || !prods.length) {
                container.innerHTML = '<div style="grid-column:1/-1;"><div class="seller-empty"><div><h3>No products listed</h3><p>This store does not have active listings right now.</p></div></div></div>';
                return;
            }
            container.innerHTML = prods.map(p => `
                <article class="seller-product-card">
                    <img src="${p.main_image || p.image || ""}" alt="${p.title}" class="seller-product-image">
                    <div class="seller-product-body">
                        <span class="seller-status success">IN STOCK</span>
                        <h3 class="seller-product-title" style="margin-top:8px;">${p.title}</h3>
                        <div class="seller-product-meta">
                            <span class="seller-product-price">D ${Number(p.price || 0).toLocaleString()}</span>
                        </div>
                        <a href="product.html?id=${p.id}" class="seller-button seller-button-primary" style="width:100%;margin-top:10px;min-height:34px;">View Item</a>
                    </div>
                </article>
            `).join("");
        } catch (e) {
            console.error(e);
        }

        document.getElementById("msgSellerBtn")?.addEventListener("click", async () => {
            const auth = window.GamBasketAuth;
            await auth.ready();
            const session = await auth.getSession();
            if (!session?.user) {
                location.href = "login.html?redirect=" + encodeURIComponent(location.href);
                return;
            }
            location.href = "messages.html";
        });

        document.getElementById("desktopThemeToggle")?.addEventListener("click", () => {
            const isDark = document.documentElement.classList.toggle("dark");
            localStorage.setItem("gambasket-theme", isDark ? "dark" : "light");
        });
    })();
    </script>
</body>
</html>
