    <script src="js/notifications.js"></script>
    <script src="js/business-roles.js"></script>
    <script src="js/trust-engine.js"></script>

    <script>
        (function() {
            "use strict";

            function formatPrice(p) {
                return new Intl.NumberFormat("en-GM", { maximumFractionDigits: 0 }).format(p || 0);
            }

            function getStatusBadge(status) {
                const map = {
                    pending: { label: "Pending Confirmation", color: "#d97706", bg: "#fef3c7", icon: "icon-clock" },
                    confirmed: { label: "Confirmed", color: "#2563eb", bg: "#eff6ff", icon: "icon-check" },
                    processing: { label: "Processing", color: "#7c3aed", bg: "#f5f3ff", icon: "icon-box" },
                    ready_for_delivery: { label: "Ready for Delivery", color: "#0284c7", bg: "#e0f2fe", icon: "icon-truck" },
                    out_for_delivery: { label: "Out for Delivery", color: "#0284c7", bg: "#e0f2fe", icon: "icon-truck" },
                    ready_for_pickup: { label: "Ready for Pickup", color: "#059669", bg: "#d1fae5", icon: "icon-store" },
                    delivered: { label: "Delivered", color: "#16a34a", bg: "#dcfce7", icon: "icon-check" },
                    completed: { label: "Completed", color: "#16a34a", bg: "#dcfce7", icon: "icon-check" },
                    cancelled: { label: "Cancelled", color: "#dc2626", bg: "#fee2e2", icon: "icon-clock" }
                };
                const s = map[status] || map.pending;
                return `
                    <span style="display: inline-flex; align-items: center; gap: 6px; padding: 5px 12px; border-radius: 20px; font-size: 12px; font-weight: 700; background: ${s.bg}; color: ${s.color};">
                        <svg class="ui-icon" style="width: 12px; height: 12px;"><use href="#${s.icon}"></use></svg>
                        <span>${s.label}</span>
                    </span>
                `;
            }

            async function renderOrders() {
                const container = document.getElementById("ordersListContainer");
                if (!container) return;

                // 1. Wait for Supabase Auth
                await window.GamBasketAuth.ready();
                const session = await window.GamBasketAuth.getSession();

                // 2. Guest handling
                if (!session || !session.user) {
                    container.innerHTML = `
                        <div style="text-align: center; padding: 70px 20px; background: var(--surface); border-radius: 24px; border: 1px solid var(--border); box-shadow: var(--shadow-small); max-width: 480px; margin: 20px auto;">
                            <div style="width: 68px; height: 68px; border-radius: 22px; background: #eff6ff; color: #2563eb; display: inline-flex; align-items: center; justify-content: center; margin-bottom: 18px;">
                                <svg class="ui-icon" style="width: 32px; height: 32px;"><use href="#icon-box"></use></svg>
                            </div>
                            <h2 style="font-size: 20px; font-weight: 800; margin: 0 0 8px; color: var(--text);">Sign in to view your orders</h2>
                            <p style="color: var(--text-secondary); font-size: 14px; line-height: 1.5; margin: 0 auto 24px; max-width: 320px;">
                                Please log in to track active deliveries and view your GamBasket order history.
                            </p>
                            <div style="display: flex; justify-content: center; gap: 12px; flex-wrap: wrap;">
                                <a href="login.html?redirect=orders.html" class="primary-btn" style="padding: 12px 26px; border-radius: 12px; font-weight: 700; text-decoration: none; font-size: 14px; background: #2563eb; color: #fff;">
                                    Sign In
                                </a>
                                <a href="signup.html?redirect=orders.html" class="secondary-btn" style="padding: 12px 24px; border-radius: 12px; font-weight: 600; text-decoration: none; font-size: 14px; border: 1px solid var(--border); color: var(--text); background: var(--surface-secondary);">
                                    Create Account
                                </a>
                            </div>
                        </div>
                    `;
                    return;
                }

                // 3. Query Orders from Supabase
                try {
                    const { data: orders, count, error } = await window.GamBasketAuth.getOrders();

                    if (error) {
                        throw error;
                    }

                    if (!orders || orders.length === 0) {
                        container.innerHTML = `
                            <div style="text-align: center; padding: 70px 20px; background: var(--surface); border-radius: 24px; border: 1px solid var(--border); box-shadow: var(--shadow-small); max-width: 500px; margin: 20px auto;">
                                <div style="width: 68px; height: 68px; border-radius: 22px; background: #eff6ff; color: #2563eb; display: inline-flex; align-items: center; justify-content: center; margin-bottom: 18px;">
                                    <svg class="ui-icon" style="width: 32px; height: 32px;"><use href="#icon-box"></use></svg>
                                </div>
                                <h2 style="font-size: 20px; font-weight: 800; margin: 0 0 8px; color: var(--text);">No Orders Yet</h2>
                                <p style="color: var(--text-secondary); font-size: 14px; line-height: 1.5; margin: 0 auto 24px; max-width: 320px;">
                                    Your completed orders and live delivery tracking will appear here once you place an order.
                                </p>
                                <a href="explore.html" class="primary-btn" style="display: inline-flex; align-items: center; gap: 8px; padding: 13px 28px; border-radius: 12px; font-weight: 700; text-decoration: none; font-size: 14px; background: #2563eb; color: #fff;">
                                    <svg class="ui-icon" style="width: 16px; height: 16px;"><use href="#icon-search"></use></svg>
                                    <span>Start Shopping</span>
                                </a>
                            </div>
                        `;
                        return;
                    }

                    let html = `<div style="display: flex; flex-direction: column; gap: 18px;">`;

                    orders.forEach(order => {
                        const dateStr = new Date(order.created_at).toLocaleDateString("en-GM", { 
                            month: "short", day: "numeric", hour: "2-digit", minute: "2-digit" 
                        });

                        html += `
                            <div style="padding: 20px; border-radius: 20px; background: var(--surface); border: 1px solid var(--border); box-shadow: var(--shadow-small);">
                                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; padding-bottom: 12px; border-bottom: 1px solid var(--border); flex-wrap: wrap; gap: 8px;">
                                    <div>
                                        <strong style="font-size: 15px; color: var(--text);">Order #${order.id}</strong>
                                        <span style="display: block; font-size: 12px; color: var(--text-secondary); margin-top: 2px;">${dateStr}</span>
                                    </div>
                                    ${getStatusBadge(order.status)}
                                </div>

                                <div style="display: flex; flex-direction: column; gap: 10px; margin-bottom: 14px;">
                                     ${(order.items || []).map(item => `
                                         <div style="display: flex; justify-content: space-between; font-size: 14px; color: var(--text);">
                                             <span>${item.quantity}x ${item.name}</span>
                                             <strong>D ${formatPrice(item.price * item.quantity)}</strong>
                                         </div>
                                     `).join("")}
                                     ${["delivered", "completed"].includes(order.status) ? (order.items || []).filter(item => item.id).map(item => `
                                         <button type="button" class="business-review-order-button" data-review-order="${order.order_id}" data-review-product="${item.id}" style="align-self:flex-start;border:0;background:transparent;color:#2563eb;font:inherit;font-size:12px;font-weight:700;cursor:pointer;padding:2px 0;">Rate “${item.name}”</button>
                                     `).join("") : ""}
                                </div>

                                <div style="background: var(--surface-secondary); padding: 12px 14px; border-radius: 14px; font-size: 13px; color: var(--text-secondary); margin-bottom: 14px; display: flex; flex-direction: column; gap: 6px;">
                                    <div style="display: flex; align-items: center; gap: 6px;">
                                        <svg class="ui-icon" style="width: 14px; height: 14px; color: #2563eb;"><use href="#icon-pin"></use></svg>
                                        <span><strong>${order.fulfillment_type === "delivery" ? "Delivery to" : "Pickup at"}:</strong> ${order.area || "Greater Banjul"} ${order.address ? `(${order.address})` : ""}</span>
                                    </div>
                                    <div style="display: flex; align-items: center; gap: 6px;">
                                        <svg class="ui-icon" style="width: 14px; height: 14px; color: #2563eb;"><use href="#icon-cart"></use></svg>
                                        <span><strong>Payment:</strong> ${order.payment_method === "cod" || order.payment_method === "cash_on_delivery" ? "Cash on Delivery" : "Mobile Money"}</span>
                                    </div>
                                </div>

                                <div style="display: flex; justify-content: space-between; align-items: center; padding-top: 10px; border-top: 1px solid var(--border);">
                                    <span style="font-size: 14px; font-weight: 600; color: var(--text-secondary);">Total</span>
                                    <strong style="font-size: 18px; font-weight: 800; color: #2563eb;">D ${formatPrice(order.total_amount || 0)}</strong>
                                </div>

                                ${order.status === "pending" ? `
                                    <button onclick="window.cancelUserOrder('${order.id}')" style="margin-top: 14px; width: 100%; padding: 10px; border-radius: 12px; border: 1px solid #fee2e2; background: transparent; color: #dc2626; font-size: 13px; font-weight: 700; cursor: pointer; transition: background 0.2s ease;">
                                        Cancel Order
                                    </button>
                                ` : ""}
                            </div>
                        `;
                    });

                    html += `</div>`;
                    container.innerHTML = html;
                    container.querySelectorAll("[data-review-order]").forEach(button => button.addEventListener("click", async () => {
                        const rating = Number(prompt("Rate this product from 1 to 5 stars:"));
                        if (!Number.isInteger(rating) || rating < 1 || rating > 5) return;
                        const title = prompt("Review title (optional):") || null;
                        const body = prompt("Tell other buyers about your purchase (optional):") || null;
                        button.disabled = true;
                        try {
                            await window.GamBasketTrust.submitReview({ orderId: button.dataset.reviewOrder, productId: button.dataset.reviewProduct, rating, title, body });
                            button.textContent = "Review submitted";
                            window.GamBasketNotifications?.add({ type: "system", title: "Review submitted", message: "Thanks for sharing verified feedback.", showToast: true });
                        } catch (error) {
                            button.disabled = false;
                            alert(error.message || "Unable to submit review.");
                        }
                    }));

                } catch (err) {
                    console.error("[GamBasket Orders Error]", err);
                    container.innerHTML = `
                        <div style="text-align: center; padding: 60px 20px; background: var(--surface); border-radius: 20px; border: 1px solid var(--border); max-width: 440px; margin: 20px auto;">
                            <div style="width: 60px; height: 60px; border-radius: 20px; background: #fee2e2; color: #ef4444; display: inline-flex; align-items: center; justify-content: center; margin-bottom: 16px;">
                                <svg class="ui-icon" style="width: 28px; height: 28px;"><use href="#icon-box"></use></svg>
                            </div>
                            <h2 style="font-size: 19px; font-weight: 800; margin: 0 0 8px; color: var(--text);">Couldn't load your orders</h2>
                            <p style="color: var(--text-secondary); font-size: 13px; margin: 0 auto 20px; max-width: 300px;">
                                Please check your connection and try again.
                            </p>
                            <button onclick="window.renderOrdersPage()" class="primary-btn" style="padding: 11px 24px; border-radius: 10px; font-weight: 700; border: none; background: #2563eb; color: #fff; cursor: pointer;">
                                Try Again
                            </button>
                        </div>
                    `;
                }
            }

            window.cancelUserOrder = async function(id) {
                if (confirm("Are you sure you want to cancel this order?")) {
                    await window.GamBasketAuth.cancelOrder(id);
                    renderOrders();
                }
            };

            window.renderOrdersPage = renderOrders;

            // Navigation Links delegation
            document.querySelectorAll(".nav-item").forEach(item => {
                item.addEventListener("click", () => {
                    const page = item.dataset.page;
                    if (page === "home") window.location.href = "index.html";
                    else if (page === "explore") window.location.href = "explore.html";
                    else if (page === "orders") window.location.href = "orders.html";
                    else if (page === "wishlist") window.navigateProtectedPage ? window.navigateProtectedPage("wishlist.html", "view your saved products") : window.location.href = "wishlist.html";
                    else if (page === "me") window.location.href = "me.html";
                });
            });

            // Listen for events
            window.addEventListener("gambasket:orders:change", renderOrders);
            window.addEventListener("gambasket:auth:change", renderOrders);

            // Initial render
            if (document.readyState === "loading") {
                document.addEventListener("DOMContentLoaded", renderOrders);
            } else {
                renderOrders();
            }
        })();
    </script>
</body>
</html>
