<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Oops! This Bag Got Lost - GamBasket</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="css/style.css">
    <script>
        (() => {
            const savedTheme = localStorage.getItem("gambasket-theme");
            if (savedTheme === "dark") {
                document.documentElement.classList.add("dark");
            }
        })();
    </script>
    <style>
        .error-page {
            min-height: 100vh;
            display: grid;
            place-items: center;
            position: relative;
            overflow: hidden;
            padding: 40px 20px calc(40px + env(safe-area-inset-bottom));
            background:
                radial-gradient(circle at 50% 16%, rgba(24, 119, 242, .12), transparent 34%),
                var(--background);
        }

        .error-scene {
            width: min(620px, 100%);
            position: relative;
            z-index: 1;
            text-align: center;
        }

        .error-code {
            position: absolute;
            top: -70px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(24, 119, 242, .055);
            font-size: clamp(100px, 19vw, 175px);
            font-weight: 900;
            letter-spacing: -.08em;
            line-height: 1;
            user-select: none;
            pointer-events: none;
        }

        .lost-bag {
            width: 210px;
            height: 235px;
            position: relative;
            margin: 36px auto 22px;
            animation: bagFloat 3.5s ease-in-out infinite;
        }

        .lost-bag svg {
            width: 100%;
            height: 100%;
            overflow: visible;
        }

        .bag-shadow {
            fill: rgba(15, 23, 42, .12);
            filter: blur(5px);
        }

        .bag-body {
            fill: url(#bagGradient);
            stroke: #0f5ec7;
            stroke-width: 2;
        }

        .bag-handle {
            fill: none;
            stroke: #1877f2;
            stroke-width: 8;
            stroke-linecap: round;
        }

        .bag-detail {
            fill: none;
            stroke: rgba(255, 255, 255, .3);
            stroke-width: 2;
            stroke-linecap: round;
        }

        .bag-eye,
        .bag-mouth {
            fill: none;
            stroke: #101828;
            stroke-width: 4;
            stroke-linecap: round;
        }

        .tear {
            fill: url(#tearGradient);
            filter: drop-shadow(0 6px 5px rgba(24, 119, 242, .2));
            transform-box: fill-box;
            transform-origin: top center;
            animation: tearDrop 1.8s ease-in infinite;
        }

        .tear.right {
            animation-delay: .45s;
        }

        .error-kicker {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            padding: 7px 12px;
            border: 1px solid rgba(24, 119, 242, .12);
            border-radius: 999px;
            background: rgba(24, 119, 242, .08);
            color: var(--blue);
            font-size: 10px;
            font-weight: 850;
            letter-spacing: .12em;
            text-transform: uppercase;
        }

        .error-kicker::before,
        .error-kicker::after {
            content: "";
            width: 4px;
            height: 4px;
            border-radius: 50%;
            background: currentColor;
            opacity: .65;
        }

        .error-title {
            margin: 14px 0 8px;
            color: var(--text);
            font-size: clamp(32px, 6vw, 50px);
            line-height: 1.02;
            letter-spacing: -.05em;
        }

        .error-text {
            max-width: 460px;
            margin: 0 auto;
            color: var(--text-secondary);
            font-size: 14px;
            line-height: 1.7;
        }

        .error-actions {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 26px;
        }

        .error-btn {
            min-width: 170px;
            min-height: 46px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 0 18px;
            border-radius: 13px;
            text-decoration: none;
            font-size: 13px;
            font-weight: 800;
            transition: transform .2s ease, box-shadow .2s ease, background .2s ease;
        }

        .error-btn:hover {
            transform: translateY(-2px);
        }

        .error-btn.primary {
            background: var(--blue);
            color: #fff;
            box-shadow: 0 10px 25px rgba(24, 119, 242, .2);
        }

        .error-btn.primary:hover {
            background: var(--blue-dark);
        }

        .error-btn.secondary {
            border: 1px solid var(--border);
            background: var(--surface);
            color: var(--text);
        }

        .error-btn svg {
            width: 16px;
            height: 16px;
        }

        .error-footnote {
            margin-top: 22px;
            color: var(--text-muted);
            font-size: 10px;
        }

        .lost-star {
            position: absolute;
            color: #60a5fa;
            font-size: 18px;
            animation: starFloat 4s ease-in-out infinite;
        }

        .lost-star.one { top: 17%; left: 9%; }
        .lost-star.two { top: 28%; right: 11%; animation-delay: 1s; }
        .lost-star.three { bottom: 17%; left: 16%; animation-delay: 1.8s; font-size: 11px; }

        @keyframes bagFloat {
            0%, 100% { transform: translateY(0) rotate(-2deg); }
            50% { transform: translateY(-9px) rotate(2deg); }
        }

        @keyframes tearDrop {
            0% { opacity: 0; transform: translateY(0) scale(.72); }
            20%, 75% { opacity: 1; }
            100% { opacity: 0; transform: translateY(34px) scale(1.06); }
        }

        @keyframes starFloat {
            0%, 100% { transform: translateY(0) rotate(0); opacity: .45; }
            50% { transform: translateY(-12px) rotate(12deg); opacity: .9; }
        }

        @media (max-width: 600px) {
            .error-page { padding-inline: 18px; }
            .error-code { top: -22px; font-size: 105px; }
            .lost-bag { margin-top: 30px; transform: scale(.88); }
            .error-title { font-size: 35px; }
            .error-text { font-size: 13px; }
            .error-actions { flex-direction: column; }
            .error-btn { width: 100%; }
            .lost-star.one { left: 3%; }
            .lost-star.two { right: 4%; }
        }

        html.dark .error-page {
            background:
                radial-gradient(circle at 50% 16%, rgba(96, 165, 250, .18), transparent 34%),
                var(--background);
        }

        html.dark .error-code { color: rgba(96, 165, 250, .07); }

        @media (prefers-reduced-motion: reduce) {
            .lost-bag, .tear, .lost-star { animation: none; }
        }
    </style>
</head>
<body>
    <main class="error-page">
        <span class="lost-star one" aria-hidden="true">✦</span>
        <span class="lost-star two" aria-hidden="true">✦</span>
        <span class="lost-star three" aria-hidden="true">·</span>

        <section class="error-scene" aria-labelledby="error-title">
            <div class="error-code" aria-hidden="true">404</div>

            <div class="lost-bag" aria-hidden="true">
                <svg viewBox="0 0 210 235" role="img">
                    <defs>
                        <linearGradient id="bagGradient" x1="25" y1="34" x2="180" y2="205" gradientUnits="userSpaceOnUse">
                            <stop stop-color="#3b91ff" />
                            <stop offset="1" stop-color="#0f5ec7" />
                        </linearGradient>
                        <linearGradient id="tearGradient" x1="0" y1="0" x2="0" y2="42" gradientUnits="userSpaceOnUse">
                            <stop stop-color="#bfdbfe" />
                            <stop offset="1" stop-color="#60a5fa" />
                        </linearGradient>
                    </defs>
                    <ellipse class="bag-shadow" cx="105" cy="221" rx="68" ry="8" />
                    <path class="bag-handle" d="M69 66V49c0-27 72-27 72 0v17" />
                    <path class="bag-body" d="M35 61h140l-9 137c-.6 9-8 16-17 16H61c-9 0-16.4-7-17-16L35 61Z" />
                    <path class="bag-detail" d="M47 76c20 9 102 9 122 0M52 95h106" />
                    <path class="bag-eye" d="M77 123c-4 5-4 12 0 17M133 140c4-5 4-12 0-17" />
                    <path class="bag-mouth" d="M94 161c7-8 15-8 22 0" />
                    <path class="tear left" d="M72 145c-7 13-10 19-10 25a10 10 0 0 0 20 0c0-6-3-12-10-25Z" />
                    <path class="tear right" d="M138 145c-7 13-10 19-10 25a10 10 0 0 0 20 0c0-6-3-12-10-25Z" />
                </svg>
            </div>

            <span class="error-kicker">Page not found</span>
            <h1 class="error-title" id="error-title">Oops... this bag got lost.</h1>
            <p class="error-text">The page you're looking for wandered outside the GamBasket marketplace. It may have moved, disappeared, or never existed.</p>

            <div class="error-actions">
                <a href="index.html" class="error-btn primary">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M3.5 10.7 12 3.8l8.5 6.9v8.1a1.7 1.7 0 0 1-1.7 1.7H5.2a1.7 1.7 0 0 1-1.7-1.7v-8.1Z"/><path d="M9 20.5v-5.8h6v5.8"/></svg>
                    Back to GamBasket
                </a>
                <a href="explore.html" class="error-btn secondary">Explore Marketplace</a>
            </div>

            <p class="error-footnote">Error 404 · GamBasket Marketplace</p>
        </section>
    </main>
</body>
</html>
